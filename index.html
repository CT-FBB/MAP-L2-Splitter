<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLT & Splitter Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .tab-navigation {
            display: flex;
            background: #1e293b;
            padding: 0 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .tab-btn {
            background: transparent;
            color: #94a3b8;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            padding: 16px 24px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            outline: none;
        }
        .tab-btn:hover {
            color: #f8fafc;
        }
        .tab-btn.active {
            color: #38bdf8;
            border-bottom-color: #38bdf8;
        }
        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        iframe.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="tab-navigation" style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex;">
            <button class="tab-btn active" onclick="switchTab(this, 'iframe-main')">🔍 L2MAP (Splitters Search)</button>
            <button class="tab-btn" onclick="switchTab(this, 'iframe-vendor')">📊 L2 Vendor Distribution</button>
        </div>
        <div style="padding-right: 10px;">
            <span style="background: rgba(99, 102, 241, 0.18); border: 1px solid rgba(99, 102, 241, 0.35); color: #a5b4fc; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-family: 'Outfit', sans-serif; font-weight: 600; letter-spacing: 0.04em;">📅 AS OF 24/09/26</span>
        </div>
    </div>

    <iframe id="iframe-main" src="olt_map.html?v=20260924" class="active"></iframe>
    <iframe id="iframe-vendor" src="choropleth_map.html?v=20260924"></iframe>

    <script>
        function switchTab(btn, iframeId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            
            btn.classList.add('active');
            document.getElementById(iframeId).classList.add('active');
        }
    </script>
</body>
</html>
